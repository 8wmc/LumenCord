name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
    contents: write

jobs:
    Build:
        name: Build LumenCord Multi-Platform
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build LumenCord (patcher.js, renderer.js, preload.js)
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Package lumencord-dist.zip
              run: |
                  if [ ! -f dist/desktop/patcher.js ]; then
                      echo "::error::dist/desktop/patcher.js missing - the installer cannot work without it"
                      exit 1
                  fi
                  mkdir -p dist/release
                  (cd dist/desktop && zip -r -9 ../release/lumencord-dist.zip .)

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir -p release

                  cp browser/browser.* release/ || true
                  cp LumenCord.user.{js,js.LEGAL.txt} release/ || true

                  # Copy plugin metadata, extension zips
                  cp *.{json,zip} release/ || true

                  cp ../install.sh release/install.sh || true

                  find release -size 0 -delete
                  rm -f release/package.json
                  rm -f release/*.map

            - name: Upload LumenCord Multi-OS Release
              run: |
                  gh release upload latest --clobber dist/release/* || gh release create latest --title "LumenCord Latest" --notes "Automated Multi-OS release for Windows, Linux (including NixOS) and macOS" dist/release/*

            # The app's updater reads the version from the release title, so keep it in sync with package.json.
            - name: Put version in release title
              run: |
                  VER="v$(jq -r .version < package.json)"
                  gh release edit latest --title "LumenCord $VER"

    Installer:
        name: Build LumenCord Installer (Windows)
        needs: Build
        runs-on: windows-latest
        defaults:
            run:
                working-directory: installer-src

        steps:
            - uses: actions/checkout@v4

            # The installer uses an older Electron toolchain, so it builds on Node 16.
            - name: Use Node.js 16
              uses: actions/setup-node@v4
              with:
                  node-version: 16

            - name: Install installer dependencies
              run: npm install --legacy-peer-deps --no-audit --no-fund

            - name: Build LumenCord-Installer.exe
              run: npm run dist

            - name: Check the installer was made
              shell: bash
              run: |
                  ls -la ../release/installer
                  test -f ../release/installer/LumenCord-Installer.exe

            - name: Upload installer to the latest release
              shell: bash
              run: gh release upload latest --clobber ../release/installer/LumenCord-Installer.exe
