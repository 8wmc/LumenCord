name: Test
on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

jobs:
    Test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v3 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # ── Must pass: these prove LumenCord actually builds and works ──────────
            - name: LumenCord desktop builds
              run: pnpm buildStandalone

            - name: LumenCord browser version builds
              run: pnpm buildWeb

            - name: Plugin list is valid
              run: pnpm generatePluginJson

            # ── Code tidiness report: shown on the run page, never fails the run ────
            # These flag style and typing nitpicks in code inherited from Nightcord/Equicord.
            # They are not crashes; the results are listed in the run summary so they can be cleaned up over time.
            - name: Code tidiness report
              if: always()
              run: |
                  {
                    echo "## Code tidiness report"
                    echo "These are style/typing notes, not crashes. LumenCord built successfully above."
                    echo
                    echo "### TypeScript"
                    if pnpm -s testTsc > tsc.txt 2>&1; then echo "No type problems."; else echo "$(grep -c 'error TS' tsc.txt) type notes. First ones:"; echo '```'; grep 'error TS' tsc.txt | head -40; echo '```'; fi
                    echo
                    echo "### ESLint"
                    if pnpm -s lint > eslint.txt 2>&1; then echo "No lint problems."; else echo "Lint notes (last lines):"; echo '```'; tail -40 eslint.txt; echo '```'; fi
                    echo
                    echo "### Stylelint"
                    if pnpm -s lint-styles > stylelint.txt 2>&1; then echo "No CSS problems."; else echo "CSS notes (first lines):"; echo '```'; head -40 stylelint.txt; echo '```'; fi
                  } >> "$GITHUB_STEP_SUMMARY"
